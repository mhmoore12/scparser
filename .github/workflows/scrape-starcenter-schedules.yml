name: Scrape StarCenter Schedules

on:
  workflow_dispatch:
    inputs:
      force_deploy_pr:
        description: "Open and close a PR to web even when scraped data is unchanged"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scrape-starcenter-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        run: |
          node scripts/scrape-starcenter-schedules.mjs --out=data/starcenter-schedules.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: starcenter-schedules
          path: data/starcenter-schedules.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit latest JSON for raw URL access
        id: commit_json
        run: |
          if git diff --quiet -- data/starcenter-schedules.json; then
            echo "No data changes."
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/starcenter-schedules.json
          git commit -m "chore(data): update StarCenter schedules [skip ci]"

          pushed=false
          for attempt in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi

            echo "Push rejected (attempt ${attempt}). Rebasing on origin/${GITHUB_REF_NAME} and retrying..."
            git fetch origin "${GITHUB_REF_NAME}"

            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "Rebase failed while resolving remote updates."
              exit 1
            fi
          done

          if [ "${pushed}" != "true" ]; then
            echo "Unable to push after retries."
            exit 1
          fi

          echo "data_changed=true" >> "$GITHUB_OUTPUT"

      - name: Open and close PR to web to trigger deployment
        if: (steps.commit_json.outputs.data_changed == 'true' || github.event.inputs.force_deploy_pr == 'true') && github.ref_name != 'web'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace("refs/heads/", "");
            const base = "web";
            const forced = (context.payload.inputs?.force_deploy_pr ?? "false") === "true";
            const title = `chore(deploy): refresh scraped schedules ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              "Automated PR opened and closed by the daily scrape workflow.",
              forced ? "Run mode: forced PR trigger (manual dispatch)." : "Run mode: change-detected trigger.",
              "",
              `Source branch: \`${head}\``,
              `Target branch: \`${base}\``,
            ].join("\n");

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: created.data.number,
              state: "closed"
            });
